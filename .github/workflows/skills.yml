name: Skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:skills
      - run: npx vitest run test/check-skills.test.ts
